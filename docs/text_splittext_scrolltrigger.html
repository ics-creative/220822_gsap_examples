<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="scrollTrigger/base.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;

        .hero,
        section {
          height: 100vh;
          margin: 0;
          display: grid;
          place-items: center;
          box-sizing: border-box;
          padding: 5vw;
        }

        .hero {
          display: flex;
          flex-direction: column;
          justify-content: center;
          font-size: 6vw;
          font-weight: 900;
          line-height: 1;
          text-align: center;

          span {
            display: block;
          }
        }

        .demo {
          margin: 0;
          font-size: 10vw;
          font-weight: 900;
          line-height: 1;
          text-align: center;

          span {
            display: block;
          }
        }
      }
    </style>
  </head>

  <body>
    <div class="hero">
      <span>PLEASE</span>
      <span>SCROLL DOWN</span>
    </div>
    <section>
      <div class="demo">
        <span>TEXT</span>
        <span>IN MOTION</span>
      </div>
    </section>
    <section>
      <div class="demo">
        <span>SCROLL</span>
        <span>TO REVEAL</span>
      </div>
    </section>
    <section>
      <div class="demo">
        <span>SPLIT</span>
        <span>EVERY</span>
        <span>LETTER</span>
      </div>
    </section>
    <section>
      <div class="demo">
        <span>POWERED</span>
        <span>BY GSAP</span>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script>
      gsap.registerPlugin(SplitText, ScrollTrigger);

      gsap.utils.toArray(".demo").forEach((element) => {
        const split = SplitText.create(element, {
          mask: "chars",
        });

        gsap.from(split.chars, {
          yPercent: 100,
          duration: 0.75,
          ease: "power4.out",
          stagger: 0.04,
          scrollTrigger: {
            trigger: element,
            start: "top 100%",
            toggleActions: "play pause resume reset",
          },
        });
      });
    </script>
  </body>
</html>
