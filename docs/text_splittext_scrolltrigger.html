<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        color: white;
        background: black;
        font-family: Cairo, sans-serif;

        &::-webkit-scrollbar {
          width: 20px;
        }

        &::-webkit-scrollbar-thumb {
          background-color: #999;
          border-radius: 10px;
        }

        &::-webkit-scrollbar-track {
          background-color: #444;
        }

        .hero,
        section {
          height: 100vh;
          display: grid;
          place-items: center;
          box-sizing: border-box;
          padding: 5vw;
        }

        .hero {
          display: flex;
          flex-direction: column;
          justify-content: center;
          font-size: 6vw;
          font-weight: 900;
          line-height: 1;
          text-align: center;

          span {
            display: block;
          }

          .scroll-arrow {
            width: 24px;
            height: 24px;
            margin-top: 48px;
            border-right: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            animation: scroll-arrow 1s infinite;
          }
        }

        .demo {
          margin: 0;
          font-size: 10vw;
          font-weight: 900;
          line-height: 1;
          text-align: center;

          span {
            display: block;
          }
        }
      }

      @keyframes scroll-arrow {
        0% {
          opacity: 0;
          transform: translateY(0) rotate(45deg);
        }

        50% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: translateY(20px) rotate(45deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="hero">
      <span>PLEASE</span>
      <span>SCROLL DOWN</span>
      <span class="scroll-arrow"></span>
    </div>
    <section>
      <div class="demo">
        <span>TEXT</span>
        <span>IN MOTION</span>
      </div>
    </section>
    <section>
      <div class="demo">
        <span>SCROLL</span>
        <span>TO REVEAL</span>
      </div>
    </section>
    <section>
      <div class="demo">
        <span>SPLIT</span>
        <span>EVERY</span>
        <span>LETTER</span>
      </div>
    </section>
    <section>
      <div class="demo">
        <span>POWERED</span>
        <span>BY GSAP</span>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script>
      gsap.registerPlugin(SplitText, ScrollTrigger);

      gsap.utils.toArray(".demo").forEach((element) => {
        const split = SplitText.create(element, {
          mask: "chars",
        });

        gsap.from(split.chars, {
          yPercent: 100,
          duration: 0.75,
          ease: "power4.out",
          stagger: 0.04,
          scrollTrigger: {
            trigger: element,
            start: "top 100%",
            toggleActions: "play pause resume reset",
          },
        });
      });
    </script>
  </body>
</html>
