<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: white;
        background: black;
        font-family: Cairo, sans-serif;

        .demo {
          margin: 0;
          font-size: 10vw;
          font-weight: 900;
          line-height: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="demo">TEXT IN MOTION</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
    <script>
      gsap.registerPlugin(SplitText);

      const split = SplitText.create(".demo", {
        mask: "chars",
      });

      gsap.from(split.chars, {
        yPercent: 100,
        duration: 0.75,
        ease: "power4.out",
        stagger: 0.04,
        repeat: -1,
        repeatDelay: 1,
      });
    </script>
  </body>
</html>
